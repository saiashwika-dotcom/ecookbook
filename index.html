*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff8f0;

}

header{
background:#ff7a18;
color:white;
text-align:center;

.controls{
text-align:center;
padding:20px;

#search{

padding:12px;
border:2px solid #ff7a18;
border-radius:8px;
}

button{
padding:12px 15px;
border:none;
background:#ff7a18;
color:white;
border-radius:8px;
cursor:pointer;
margin:5px;
}

button:hover{
background:#e65f00;
}

.recipe-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:20px;
}

.recipe-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
transition:0.3s;
}

.recipe-card:hover{
transform:translateY(-5px);
}

.recipe-category{
color:#ff7a18;
font-weight:bold;
}

.favorite{
float:right;
cursor:pointer;
font-size:20px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:25px;
border-radius:15px;
width:80%;
max-width:700px;
max-height:90vh;
overflow-y:auto;
}

.close{
float:right;
font-size:28px;
cursor:pointer;
}

.dark{
background:#1e1e1e;
color:white;
}

.dark .recipe-card{
background:#2d2d2d;
color:white;
}

.dark .controls{
background:#2d2d2d;
}

footer{

color:white;
text-align:center;
padding:15px;
margin-top:20px;

// Display Recipes

function displayRecipes(recipeList){

const grid = document.getElementById("recipeGrid");

grid.innerHTML = "";

recipeList.forEach(recipe => {

grid.innerHTML += `
<div class="recipe-card">

<span class="favorite" onclick="toggleFavorite(this)">❤️</span>

<p class="recipe-category">${recipe.category}</p>

<h2>${recipe.title}</h2>

<p>${recipe.description}</p>

<br>

<button onclick="openRecipe(${recipe.id})">
View Recipe
</button>

</div>
`;

});

}

// Open Recipe Modal

function openRecipe(id){

const recipe = recipes.find(r => r.id === id);

document.getElementById("modalBody").innerHTML = `

<h2>${recipe.title}</h2>

<p><strong>Category:</strong> ${recipe.category}</p>

<br>

<h3>Ingredients</h3>

<ul>
${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}
</ul>

<br>

<h3>Instructions</h3>

<ol>
${recipe.instructions.map(i => `<li>${i}</li>`).join("")}
</ol>

`;

document.getElementById("recipeModal").style.display = "flex";

}

// Close Modal

function closeModal(){

document.getElementById("recipeModal").style.display = "none";

}

// Search Function

document.getElementById("search").addEventListener("keyup", function(){

let value = this.value.toLowerCase();

let filtered = recipes.filter(recipe =>

recipe.title.toLowerCase().includes(value) ||

recipe.category.toLowerCase().includes(value) ||

recipe.description.toLowerCase().includes(value)

);

displayRecipes(filtered);

});

// Favorites

function toggleFavorite(element){

if(element.innerHTML === "❤️"){

element.innerHTML = "💖";

}

else{

element.innerHTML = "❤️";

}

}

// Dark Mode

function toggleDarkMode(){

document.body.classList.toggle("dark");

}

// Initial Load

displayRecipes(recipes);
